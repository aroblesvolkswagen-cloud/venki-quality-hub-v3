<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maestro Cervecero AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              amber: {
                450: '#f59e0b',
              },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        background: radial-gradient(circle at 20% 20%, rgba(251, 191, 36, 0.05), transparent 25%),
          radial-gradient(circle at 80% 0%, rgba(59, 130, 246, 0.08), transparent 30%),
          #0f172a;
      }
      body {
        background: #0f172a;
        color: #e2e8f0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
      }
    </style>
    <script>
      // Polyfill para process.env en navegadores/Electron
      if (typeof window !== 'undefined' && typeof window.process === 'undefined') {
        window.process = { env: {} };
      }
    </script>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
